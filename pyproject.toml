[project]
name = "skiptlu"
version = "0.1.0"
description = "Moodle/ELMS course progress automation engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<14",
  "beautifulsoup4>=4.12,<5",
  "python-docx>=1.1,<2",
  "lxml>=5,<7",
  "pypdf>=5,<7",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.50,<2",
]

[project.scripts]
skiptlu = "skiptlu.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

